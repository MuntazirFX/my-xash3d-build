name: Build Xash3D-FWGS iOS IPA (3 Fresh Games - Valve/Gearbox/Bshift)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SDL_VERSION: 2.32.10

jobs:
  # ---------------------------------------------------------
  # JOB 1: Build the engine for iOS (arm64)
  # ---------------------------------------------------------
  build-engine-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v4
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          path: engine

      - name: Build SDL2 xcframework for iOS
        run: |
          git clone https://github.com/libsdl-org/SDL -b "release-${SDL_VERSION}"
          cd SDL/Xcode/SDL
          xcodebuild -scheme xcFramework-iOS -target xcFramework-iOS build -configuration Release
          sudo cp -vr Products/SDL2.xcframework/ios-arm64/SDL2.framework /Library/Frameworks

      - name: Configure & build engine (waf, iOS target)
        working-directory: engine
        run: |
          ./waf configure --enable-lto --ios build install --destdir=build/ios
          cp -vr /Library/Frameworks/SDL2.framework ./build

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-ios-arm64
          path: |
            engine/build/ios
            engine/build/SDL2.framework
            engine/engine/platform/ios/bundle

  # ---------------------------------------------------------
  # JOB 2: Build the 3 verified games for iOS (matrix)
  # Branches confirmed to exist: master (valve), opfor (gearbox), bshift (bshift)
  # ---------------------------------------------------------
  build-games-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gamedir: valve
            branch: master
          - gamedir: gearbox
            branch: opfor
          - gamedir: bshift
            branch: bshift
    steps:
      - name: Checkout hlsdk-portable (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          repository: FWGS/hlsdk-portable
          ref: ${{ matrix.branch }}
          submodules: recursive
          path: gamesrc

      - name: Configure (CMake, iOS target - same flags as FWGS official CI)
        working-directory: gamesrc
        run: |
          cmake -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
                -DCMAKE_INSTALL_PREFIX="$(pwd)/../dist/${{ matrix.gamedir }}" \
                -DCMAKE_BUILD_TYPE=Release \
                -B build -S .

      - name: Build & install
        working-directory: gamesrc
        run: cmake --build build --target install

      - name: Upload game artifact (own gamedir folder - avoids client.dylib clash)
        uses: actions/upload-artifact@v4
        with:
          name: game-ios-${{ matrix.gamedir }}
          path: dist/${{ matrix.gamedir }}

  # ---------------------------------------------------------
  # JOB 3: Assemble app bundle (engine + 3 gamedirs) + sign + zip .ipa
  # ---------------------------------------------------------
  package-ipa:
    needs: [ build-engine-ios, build-games-ios ]
    runs-on: macos-latest
    steps:
      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-ios-arm64
          path: engineart

      - name: Download valve
        uses: actions/download-artifact@v4
        with: { name: game-ios-valve,   path: games/valve }
      - name: Download gearbox
        uses: actions/download-artifact@v4
        with: { name: game-ios-gearbox, path: games/gearbox }
      - name: Download bshift
        uses: actions/download-artifact@v4
        with: { name: game-ios-bshift,  path: games/bshift }

      - name: Assemble xash3d.app bundle
        run: |
          set -e
          APP=payload_root/Payload/xash3d.app
          mkdir -p "$APP"

          # Engine binaries (waf destdir layout: engineart/ios/*)
          cp -r engineart/ios/* "$APP/"

          # App metadata + frameworks
          cp engineart/engine/platform/ios/bundle/Info.plist "$APP/"
          cp -r engineart/SDL2.framework "$APP/"

          # Each game keeps its own subfolder -> no client.dylib clash
          for g in valve gearbox bshift; do
            mkdir -p "$APP/$g"
            cp -r "games/$g/"* "$APP/$g/"
          done

          echo "Final bundle layout:"
          find "$APP" -maxdepth 2

      - name: Ad-hoc codesign
        run: |
          codesign --entitlements engineart/engine/platform/ios/bundle/entitlements.plist \
                    --sign "-" --force payload_root/Payload/xash3d.app

      - name: Create IPA
        run: |
          cd payload_root
          zip -q -r ../xash3d-fwgs-3games-ios-arm64.ipa Payload

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-fwgs-3games-ios-arm64
          path: xash3d-fwgs-3games-ios-arm64.ipa
