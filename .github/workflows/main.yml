name: Build Xash3D-FWGS iOS IPA (3 Fresh Games - Valve/Gearbox/Bshift)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SDL_VERSION: 2.32.10

jobs:
  # ---------------------------------------------------------
  # JOB 1: Build the engine for iOS (arm64)
  # ---------------------------------------------------------
  build-engine-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout xash3d-fwgs
        uses: actions/checkout@v4
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
          path: engine

      - name: Build SDL2 xcframework for iOS
        run: |
          git clone https://github.com/libsdl-org/SDL -b "release-${SDL_VERSION}"
          cd SDL/Xcode/SDL
          xcodebuild -scheme xcFramework-iOS -target xcFramework-iOS build -configuration Release
          sudo cp -vr Products/SDL2.xcframework/ios-arm64/SDL2.framework /Library/Frameworks

      - name: Configure & build engine (waf, iOS target)
        working-directory: engine
        run: |
          ./waf configure --enable-lto --ios build install --destdir=build/ios
          cp -vr /Library/Frameworks/SDL2.framework ./build

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-ios-arm64
          path: |
            engine/build/ios
            engine/build/SDL2.framework
            engine/engine/platform/ios/bundle

  # ---------------------------------------------------------
  # JOB 2: Build the 3 verified games for iOS (matrix)
  # Branches confirmed to exist: master (valve), opfor (gearbox), bshift (bshift)
  # ---------------------------------------------------------
  build-games-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gamedir: valve
            branch: master
          - gamedir: gearbox
            branch: opfor
          - gamedir: bshift
            branch: bshift
    steps:
      - name: Checkout hlsdk-portable (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          repository: FWGS/hlsdk-portable
          ref: ${{ matrix.branch }}
          submodules: recursive
          path: gamesrc

      - name: Patch game_shared/neon_mathfun.h (missing 'static' on inline fns)
        working-directory: gamesrc
        run: |
          # game_shared/neon_mathfun.h declares several NEON helper
          # functions (sincos_ps, asincos_ps, sin_ps, cos_ps, etc.) as plain
          # `inline` without `static`. Under C99 inline semantics this only
          # produces a symbol if the compiler actually inlines every call
          # site - which isn't guaranteed (it depends on optimizer
          # heuristics and can differ per branch/function). When it
          # doesn't inline, linking fails with:
          #   "Undefined symbols ... _sincos_ps, referenced from _AngleMatrix"
          # Adding `static` gives each translation unit its own internal
          # copy, which always links correctly regardless of inlining.
          if [ -f game_shared/neon_mathfun.h ]; then
            sed -i.bak -E 's/^inline /static inline /' game_shared/neon_mathfun.h
            rm -f game_shared/neon_mathfun.h.bak
            echo "Patched. Remaining non-static inline fns (should be none):"
            grep -n "^inline " game_shared/neon_mathfun.h || echo "(none)"
          else
            echo "neon_mathfun.h not found in this branch - skipping patch"
          fi

      - name: Configure (CMake, iOS target - same flags as FWGS official CI)
        working-directory: gamesrc
        run: |
          # NOTE on build type - must be neither plain "Release" nor "Debug":
          #
          # 1. NOT "Release": hlsdk-portable's cl_dll/CMakeLists.txt &
          #    dlls/CMakeLists.txt run a POST_BUILD `strip` step only when
          #    CMAKE_BUILD_TYPE MATCHES "Release". On iOS cross-compilation
          #    that strip invocation resolves incorrectly ("no files
          #    specified").
          #
          # 2. NOT "Debug" (unoptimized/-O0): game_shared/neon_mathfun.h
          #    declares `sincos_ps` as a plain `inline` function (missing
          #    `static`). Under C99 inline semantics, an unoptimized build
          #    won't actually inline the call, and without `static` no
          #    externally-linkable definition exists - causing
          #    "Undefined symbols ... _sincos_ps" at link time (seen on
          #    the master/valve branch, which uses this NEON codepath).
          #
          # "RelWithDebInfo" avoids both: it optimizes (so sincos_ps gets
          # inlined) and its name doesn't match the "Release" regex (so the
          # buggy strip step is skipped).
          cmake -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
                -DCMAKE_INSTALL_PREFIX="$(pwd)/../dist/${{ matrix.gamedir }}" \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -B build -S .

      - name: Build & install
        working-directory: gamesrc
        run: cmake --build build --target install

      - name: Upload game artifact (own gamedir folder - avoids client.dylib clash)
        uses: actions/upload-artifact@v4
        with:
          name: game-ios-${{ matrix.gamedir }}
          path: dist/${{ matrix.gamedir }}

  # ---------------------------------------------------------
  # JOB 3: Assemble app bundle (engine + 3 gamedirs) + sign + zip .ipa
  # ---------------------------------------------------------
  package-ipa:
    needs: [ build-engine-ios, build-games-ios ]
    runs-on: macos-latest
    steps:
      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-ios-arm64
          path: engineart

      - name: Download valve
        uses: actions/download-artifact@v4
        with: { name: game-ios-valve,   path: games/valve }
      - name: Download gearbox
        uses: actions/download-artifact@v4
        with: { name: game-ios-gearbox, path: games/gearbox }
      - name: Download bshift
        uses: actions/download-artifact@v4
        with: { name: game-ios-bshift,  path: games/bshift }

      - name: Assemble xash3d.app bundle
        run: |
          set -e
          APP=payload_root/Payload/xash3d.app
          mkdir -p "$APP"

          # Engine binaries (waf destdir layout: engineart/build/ios/*)
          # NOTE: upload-artifact computes a common root across the 3
          # uploaded paths (engine/build/ios, engine/build/SDL2.framework,
          # engine/engine/platform/ios/bundle) - that root is "engine/",
          # so on download everything sits one level deeper than the
          # original in-job paths: engineart/build/ios/*,
          # engineart/build/SDL2.framework, and
          # engineart/engine/platform/ios/bundle/* (this last one already
          # keeps its "engine/" prefix since it was engine/engine/...).
          cp -r engineart/build/ios/* "$APP/"

          # App metadata + frameworks
          cp engineart/engine/platform/ios/bundle/Info.plist "$APP/"
          cp -r engineart/build/SDL2.framework "$APP/"

          # Each game keeps its own subfolder -> no client.dylib clash
          for g in valve gearbox bshift; do
            mkdir -p "$APP/$g"
            cp -r "games/$g/"* "$APP/$g/"
          done

          echo "Final bundle layout:"
          find "$APP" -maxdepth 2

      - name: Ad-hoc codesign
        run: |
          codesign --entitlements engineart/engine/platform/ios/bundle/entitlements.plist \
                    --sign "-" --force payload_root/Payload/xash3d.app

      - name: Create IPA
        run: |
          cd payload_root
          zip -q -r ../xash3d-fwgs-3games-ios-arm64.ipa Payload

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-fwgs-3games-ios-arm64
          path: xash3d-fwgs-3games-ios-arm64.ipa
