name: Build XashFusion iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build XashFusion iOS ARM64
    runs-on: macos-latest

    env:
      SDL_VERSION: "2.32.10"
      IOS_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify repository
        run: |
          set -euxo pipefail

          echo "===== Repository ====="
          pwd
          ls -la

          echo "===== Engine ====="
          test -f engine/waf
          test -f engine/wscript
          ls -la engine

          echo "===== HLSDK ====="
          ls -la hlsdk || true

      - name: Initialize all submodules
        working-directory: engine
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "===== Submodule status ====="
          git submodule status --recursive

          echo "===== libbacktrace ====="
          if [ -d "3rdparty/libbacktrace" ]; then
            ls -la 3rdparty/libbacktrace
          else
            echo "ERROR: 3rdparty/libbacktrace directory is missing"
            exit 1
          fi

      - name: Verify libbacktrace
        working-directory: engine
        run: |
          set -euxo pipefail

          if [ ! -f "3rdparty/libbacktrace/Makefile" ] && \
             [ ! -f "3rdparty/libbacktrace/configure" ] && \
             [ ! -d "3rdparty/libbacktrace/.git" ]; then
            echo "libbacktrace contents:"
            find 3rdparty/libbacktrace -maxdepth 2 -print | head -100
          fi

          test -d 3rdparty/libbacktrace

      - name: Select Xcode
        run: |
          set -euxo pipefail

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: |
          set -euxo pipefail

          brew update
          brew install python cmake pkg-config

          python3 --version
          cmake --version
          pkg-config --version

      - name: Build SDL2 for iOS
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/SDL"

          git clone \
            --depth=1 \
            --branch "release-${SDL_VERSION}" \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL"

          echo "===== SDL commit ====="
          git rev-parse HEAD

          echo "===== SDL Xcode schemes ====="
          xcodebuild \
            -project Xcode/SDL/SDL.xcodeproj \
            -list

          cd Xcode/SDL

          xcodebuild \
            -project SDL.xcodeproj \
            -scheme xcFramework-iOS \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build

      - name: Locate SDL2 framework
        run: |
          set -euxo pipefail

          echo "===== Searching SDL2 ====="

          find "$RUNNER_TEMP/SDL" \
            -type d \
            -name "*.framework" \
            -print

          find "$RUNNER_TEMP/SDL" \
            -type f \
            -name "SDL2" \
            -print

      - name: Prepare SDL2 framework
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/SDL2"

          SDL_FRAMEWORK="$(find "$RUNNER_TEMP/SDL" \
            -type d \
            -path "*/Products/*/SDL2.framework" \
            | head -1)"

          if [ -z "$SDL_FRAMEWORK" ]; then
            echo "ERROR: SDL2.framework was not found"
            find "$RUNNER_TEMP/SDL" -maxdepth 8 -type d -name "*.framework" -print
            exit 1
          fi

          echo "SDL framework:"
          echo "$SDL_FRAMEWORK"

          cp -R \
            "$SDL_FRAMEWORK" \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework"

          test -f \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework/SDL2"

          file \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework/SDL2"

      - name: Configure Xash3D-FWGS
        working-directory: engine
        run: |
          set -euxo pipefail

          echo "===== Waf ====="
          ./waf --version

          echo "===== Configure iOS ARM64 ====="

          ./waf configure \
            --ios \
            --arch=arm64 \
            --enable-bundled-deps \
            --enable-lto \
            --sdl2="$GITHUB_WORKSPACE/build/SDL2/SDL2.framework"

      - name: Build Xash3D-FWGS
        working-directory: engine
        run: |
          set -euxo pipefail

          ./waf build -v -j2

      - name: Install Xash3D-FWGS
        working-directory: engine
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/xash-install"

          ./waf install \
            --destdir="$GITHUB_WORKSPACE/build/xash-install"

      - name: Find engine binaries
        run: |
          set -euxo pipefail

          echo "===== Installed files ====="

          find build/xash-install \
            -type f \
            -print \
            | sort

          echo "===== Mach-O files ====="

          find build/xash-install \
            -type f \
            -exec file {} \; \
            | grep -E "Mach-O" || true

      - name: Verify ARM64 engine
        run: |
          set -euxo pipefail

          ENGINE_FOUND=0

          while IFS= read -r -d '' FILE; do
            INFO="$(file "$FILE")"

            echo "$INFO"

            if echo "$INFO" | grep -Eq \
              "Mach-O.*arm64|Mach-O 64-bit.*arm64"; then
              ENGINE_FOUND=1
            fi

          done < <(
            find build/xash-install \
              -type f \
              -print0
          )

          if [ "$ENGINE_FOUND" -eq 0 ]; then
            echo "ERROR: No ARM64 Mach-O binary was produced."
            exit 1
          fi

      - name: Check HLSDK source
        run: |
          set -euxo pipefail

          echo "===== HLSDK directories ====="

          for DIR in \
            valve \
            bshift \
            gearbox \
            cstrike \
            cstrike-server \
            czero \
            czero-server
          do
            if [ -d "hlsdk/$DIR" ]; then
              echo "FOUND: hlsdk/$DIR"
            else
              echo "MISSING: hlsdk/$DIR"
            fi
          done

      - name: Prepare engine artifact
        run: |
          set -euxo pipefail

          mkdir -p artifacts/xash3d

          cp -R \
            build/xash-install/. \
            artifacts/xash3d/

          cp -R \
            build/SDL2/SDL2.framework \
            artifacts/xash3d/

      - name: Create engine archive
        run: |
          set -euxo pipefail

          cd artifacts

          tar -czf \
            XashFusion-iOS-ARM64-engine.tar.gz \
            xash3d

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-ARM64-engine
          path: artifacts/XashFusion-iOS-ARM64-engine.tar.gz
          if-no-files-found: error
