name: XashFusion - iOS Engine ARM64

on:
  workflow_dispatch:

jobs:
  build-engine:
    name: Build Xash3D-FWGS iOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare FWGS submodules
        working-directory: engine
        shell: bash
        run: |
          set -e

          echo "Reading FWGS .gitmodules..."

          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
            | while read -r key path; do
                name="${key#submodule.}"
                name="${name%.path}"

                url="$(git config -f .gitmodules \
                  --get "submodule.${name}.url")"

                echo ""
                echo "========================================"
                echo "Submodule: $name"
                echo "Path:     $path"
                echo "URL:      $url"
                echo "========================================"

                rm -rf "$path"
                mkdir -p "$(dirname "$path")"

                git clone --recursive "$url" "$path"
              done

      - name: Verify FWGS dependencies
        working-directory: engine
        shell: bash
        run: |
          set -e

          echo "Checking required submodules..."

          test -d 3rdparty/libbacktrace
          test -d 3rdparty/libbacktrace/libbacktrace

          echo "libbacktrace: OK"

          find 3rdparty/libbacktrace -maxdepth 2 -type f | head -30

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          xcodebuild -version
          clang --version
          python3 --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build SDL2 for iOS ARM64
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          xcodebuild \
            -scheme xcFramework-iOS \
            -target xcFramework-iOS \
            -configuration Release \
            build

          test -f \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework/SDL2

          mkdir -p "$RUNNER_TEMP/SDL-install"

          cp -R \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework \
            "$RUNNER_TEMP/SDL-install/SDL2.framework"

      - name: Verify SDL2 ARM64
        shell: bash
        run: |
          set -e

          file \
            "$RUNNER_TEMP/SDL-install/SDL2.framework/SDL2"

      - name: Configure Xash3D-FWGS
        working-directory: engine
        shell: bash
        run: |
          set -e

          python3 ./waf configure \
            --ios \
            --enable-lto \
            --enable-bundled-deps \
            --sdl2="$RUNNER_TEMP/SDL-install/SDL2.framework"

      - name: Build Xash3D-FWGS
        working-directory: engine
        shell: bash
        run: |
          set -e
          python3 ./waf build -v

      - name: Install Xash3D-FWGS
        working-directory: engine
        shell: bash
        run: |
          set -e

          rm -rf ../build/ios

          python3 ./waf install \
            --destdir="../build/ios"

      - name: Inspect engine output
        shell: bash
        run: |
          set -e

          echo "===== build/ios ====="
          find build/ios -type f -print

          echo ""
          echo "===== engine/build ====="
          find engine/build -type f -print | head -200

      - name: Verify ARM64 Mach-O
        shell: bash
        run: |
          set -e

          found=0

          while IFS= read -r file_path; do
            if file "$file_path" | grep -Eq \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then

              echo "ARM64 MACH-O FOUND:"
              echo "$file_path"

              found=1
            fi
          done < <(
            find build/ios engine/build \
              -type f \
              2>/dev/null
          )

          if [ "$found" -ne 1 ]; then
            echo "ERROR: No ARM64 Mach-O binary produced."
            exit 1
          fi

      - name: Package engine artifact
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact/xash3d-ios-arm64

          cp -R \
            build/ios/. \
            artifact/xash3d-ios-arm64/

          cp -R \
            "$RUNNER_TEMP/SDL-install/SDL2.framework" \
            artifact/xash3d-ios-arm64/SDL2.framework

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-engine-arm64
          path: artifact/xash3d-ios-arm64
          if-no-files-found: error
