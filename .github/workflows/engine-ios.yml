name: XashFusion - iOS ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build XashFusion iOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show toolchain
        run: |
          set -euxo pipefail

          xcodebuild -version
          clang --version
          python3 --version
          cmake --version

      # ------------------------------------------------------------
      # SDL2 iOS
      # ------------------------------------------------------------
      - name: Build SDL2 iOS ARM64
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/SDL"

          git clone \
            --depth=1 \
            --branch SDL2 \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          echo "===== SDL XCODE PROJECT ====="
          xcodebuild -project SDL.xcodeproj -list

          echo "===== BUILD SDL2 XCFRAMEWORK ====="

          xcodebuild \
            -project SDL.xcodeproj \
            -scheme xcFramework-iOS \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build

          echo "===== LOCATE SDL2.XCFRAMEWORK ====="

          find . \
            -type d \
            -path "*/Products/SDL2.xcframework" \
            -print

          SDL_XCFRAMEWORK="$(
            find . \
              -type d \
              -path "*/Products/SDL2.xcframework" \
              | head -n 1
          )"

          test -n "$SDL_XCFRAMEWORK"

          echo "SDL_XCFRAMEWORK=$SDL_XCFRAMEWORK"

          test -d "$SDL_XCFRAMEWORK/ios-arm64/SDL2.framework"
          test -f "$SDL_XCFRAMEWORK/ios-arm64/SDL2.framework/SDL2"

          rm -rf "$RUNNER_TEMP/SDL2.framework"

          cp -R \
            "$SDL_XCFRAMEWORK/ios-arm64/SDL2.framework" \
            "$RUNNER_TEMP/SDL2.framework"

          echo "===== SDL2 FRAMEWORK ====="
          file "$RUNNER_TEMP/SDL2.framework/SDL2"

      # ------------------------------------------------------------
      # Official Xash3D-FWGS engine
      # ------------------------------------------------------------
      - name: Checkout official FWGS engine
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/xash3d-fwgs"

          git clone \
            --recursive \
            --depth=1 \
            https://github.com/FWGS/xash3d-fwgs \
            "$RUNNER_TEMP/xash3d-fwgs"

          cd "$RUNNER_TEMP/xash3d-fwgs"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "===== CHECK REQUIRED SUBMODULES ====="

          test -f 3rdparty/libbacktrace/libbacktrace/README.md || \
            test -d 3rdparty/libbacktrace/libbacktrace

          test -d 3rdparty/freevgui
          test -d 3rdparty/library_suffix

      - name: Configure Xash3D-FWGS iOS ARM64
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          rm -rf build

          cp -R \
            "$RUNNER_TEMP/SDL2.framework" \
            ./SDL2.framework

          test -f SDL2.framework/SDL2

          echo "===== XASH3D CONFIGURE ====="

          ./waf configure \
            --ios \
            --enable-bundled-deps \
            --enable-lto \
            --sdl2="$(realpath SDL2.framework)"

      - name: Build Xash3D-FWGS
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          ./waf build

      - name: Install Xash3D-FWGS
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          rm -rf build/ios

          ./waf install \
            --destdir="$(realpath build/ios)"

          echo "===== ENGINE OUTPUT ====="

          find build/ios \
            -maxdepth 4 \
            -type f \
            -print

      - name: Verify Xash3D ARM64 binary
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          echo "===== SEARCH ENGINE BINARY ====="

          find build/ios \
            -type f \
            \( \
              -name "xash" \
              -o -name "xash3d" \
            \) \
            -print

          ENGINE_BIN="$(
            find build/ios \
              -type f \
              \( \
                -name "xash" \
                -o -name "xash3d" \
              \) \
              | head -n 1
          )"

          test -n "$ENGINE_BIN"

          echo "ENGINE_BIN=$ENGINE_BIN"

          file "$ENGINE_BIN"

          lipo -info "$ENGINE_BIN" || true

          chmod +x "$ENGINE_BIN"

      # ------------------------------------------------------------
      # Half-Life / Blue Shift / Opposing Force
      # ------------------------------------------------------------
      - name: Build Half-Life SDK libraries ARM64
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          mkdir -p \
            "$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          PREFIX="$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          build_hlsdk() {
            NAME="$1"
            SOURCE="$2"
            GAME="$3"

            echo ""
            echo "================================================"
            echo "BUILDING $NAME"
            echo "SOURCE: $SOURCE"
            echo "GAME: $GAME"
            echo "================================================"

            rm -rf "$RUNNER_TEMP/hlsdk-$NAME"

            cmake \
              -S "$SOURCE" \
              -B "$RUNNER_TEMP/hlsdk-$NAME" \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DGAMEDIR="$GAME" \
              -D64BIT=ON

            cmake \
              --build "$RUNNER_TEMP/hlsdk-$NAME" \
              --target install \
              --parallel
          }

          build_hlsdk \
            "valve" \
            "$GITHUB_WORKSPACE/hlsdk/valve" \
            "valve"

          build_hlsdk \
            "bshift" \
            "$GITHUB_WORKSPACE/hlsdk/bshift" \
            "bshift"

          build_hlsdk \
            "gearbox" \
            "$GITHUB_WORKSPACE/hlsdk/gearbox" \
            "gearbox"

      # ------------------------------------------------------------
      # Counter-Strike 1.6 client + menu
      # ------------------------------------------------------------
      - name: Build CS 1.6 client and menu ARM64
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          PREFIX="$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          rm -rf "$RUNNER_TEMP/cstrike-build"

          cmake \
            -S "$GITHUB_WORKSPACE/hlsdk/cstrike" \
            -B "$RUNNER_TEMP/cstrike-build" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DGAME_DIR=cstrike \
            -DBUILD_CLIENT=ON \
            -DBUILD_MAINUI=ON \
            -DBUILD_SERVER=OFF \
            -D64BIT=ON

          cmake \
            --build "$RUNNER_TEMP/cstrike-build" \
            --target install \
            --parallel

      # ------------------------------------------------------------
      # Condition Zero client + menu
      # ------------------------------------------------------------
      - name: Build Condition Zero client and menu ARM64
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          PREFIX="$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          rm -rf "$RUNNER_TEMP/czero-build"

          cmake \
            -S "$GITHUB_WORKSPACE/hlsdk/czero" \
            -B "$RUNNER_TEMP/czero-build" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DGAME_DIR=czero \
            -DBUILD_CLIENT=ON \
            -DBUILD_MAINUI=ON \
            -DBUILD_SERVER=OFF \
            -D64BIT=ON

          cmake \
            --build "$RUNNER_TEMP/czero-build" \
            --target install \
            --parallel

      # ------------------------------------------------------------
      # CS ReGameDLL server
      # ------------------------------------------------------------
      - name: Build CS server ARM64
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          PREFIX="$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          rm -rf "$RUNNER_TEMP/cstrike-server-build"

          cmake \
            -S "$GITHUB_WORKSPACE/hlsdk/cstrike-server" \
            -B "$RUNNER_TEMP/cstrike-server-build" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_CXX_STANDARD=17

          cmake \
            --build "$RUNNER_TEMP/cstrike-server-build" \
            --parallel

          echo "===== CS SERVER OUTPUT ====="

          find "$RUNNER_TEMP/cstrike-server-build" \
            -type f \
            -name "*.dylib" \
            -print

      # ------------------------------------------------------------
      # CZ ReGameDLL server
      # ------------------------------------------------------------
      - name: Build CZ server ARM64
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail

          PREFIX="$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          rm -rf "$RUNNER_TEMP/czero-server-build"

          cmake \
            -S "$GITHUB_WORKSPACE/hlsdk/czero-server" \
            -B "$RUNNER_TEMP/czero-server-build" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_CXX_STANDARD=17

          cmake \
            --build "$RUNNER_TEMP/czero-server-build" \
            --parallel

          echo "===== CZ SERVER OUTPUT ====="

          find "$RUNNER_TEMP/czero-server-build" \
            -type f \
            -name "*.dylib" \
            -print

      # ------------------------------------------------------------
      # Normalize CS/CZ server library names
      # ------------------------------------------------------------
      - name: Install CS and CZ server libraries
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="$RUNNER_TEMP/xash3d-fwgs/build/ios/libs"

          mkdir -p \
            "$PREFIX/cstrike/dlls" \
            "$PREFIX/czero/dlls"

          echo "===== CS SERVER LIBRARIES ====="

          find "$RUNNER_TEMP/cstrike-server-build" \
            -type f \
            -name "*.dylib" \
            -print

          CS_SERVER="$(
            find "$RUNNER_TEMP/cstrike-server-build" \
              -type f \
              -name "*.dylib" \
              | grep -E '(regamedll|mp).*arm64.*\.dylib$' \
              | head -n 1 || true
          )"

          if [ -n "$CS_SERVER" ]; then
            cp "$CS_SERVER" "$PREFIX/cstrike/dlls/mp_arm64.dylib"
          else
            CS_SERVER="$(
              find "$RUNNER_TEMP/cstrike-server-build" \
                -type f \
                -name "*.dylib" \
                | head -n 1 || true
            )"

            if [ -n "$CS_SERVER" ]; then
              cp "$CS_SERVER" "$PREFIX/cstrike/dlls/mp_arm64.dylib"
            fi
          fi

          echo "===== CZ SERVER LIBRARIES ====="

          find "$RUNNER_TEMP/czero-server-build" \
            -type f \
            -name "*.dylib" \
            -print

          CZ_SERVER="$(
            find "$RUNNER_TEMP/czero-server-build" \
              -type f \
              -name "*.dylib" \
              | grep -E '(regamedll|mp).*arm64.*\.dylib$' \
              | head -n 1 || true
          )"

          if [ -n "$CZ_SERVER" ]; then
            cp "$CZ_SERVER" "$PREFIX/czero/dlls/mp_arm64.dylib"
          else
            CZ_SERVER="$(
              find "$RUNNER_TEMP/czero-server-build" \
                -type f \
                -name "*.dylib" \
                | head -n 1 || true
            )

            if [ -n "$CZ_SERVER" ]; then
              cp "$CZ_SERVER" "$PREFIX/czero/dlls/mp_arm64.dylib"
            fi
          fi

      # ------------------------------------------------------------
      # Verify ALL libraries
      # ------------------------------------------------------------
      - name: Verify generated ARM64 libraries
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          echo ""
          echo "=============================================="
          echo "XASHFUSION GENERATED LIBRARIES"
          echo "=============================================="

          find build/ios/libs \
            -type f \
            -print \
            | sort

          echo ""
          echo "=============================================="
          echo "DYLIB ARCHITECTURES"
          echo "=============================================="

          find build/ios/libs \
            -type f \
            -name "*.dylib" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo ""
            echo "----- $file -----"
            file "$file"
            lipo -info "$file" || true
          done

          echo ""
          echo "=============================================="
          echo "EXPECTED FILES"
          echo "=============================================="

          find build/ios/libs \
            -type f \
            \( \
              -name "hl_arm64.dylib" \
              -o -name "bshift_arm64.dylib" \
              -o -name "gearbox_arm64.dylib" \
              -o -name "client_arm64.dylib" \
              -o -name "menu_arm64.dylib" \
              -o -name "mp_arm64.dylib" \
            \) \
            -print

      # ------------------------------------------------------------
      # SDL2 framework for IPA
      # ------------------------------------------------------------
      - name: Prepare SDL2 framework
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          rm -rf build/SDL2.framework

          cp -R \
            "$RUNNER_TEMP/SDL2.framework" \
            build/SDL2.framework

          test -f build/SDL2.framework/SDL2

      # ------------------------------------------------------------
      # Create IPA using official FWGS iOS packaging script
      # ------------------------------------------------------------
      - name: Create iOS IPA
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          chmod +x scripts/ios/createipa.sh

          ./scripts/ios/createipa.sh

          test -f build/xash3d.ipa

          echo "===== IPA CREATED ====="

          ls -lh build/xash3d.ipa

      # ------------------------------------------------------------
      # Rename IPA
      # ------------------------------------------------------------
      - name: Rename IPA
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cp \
            build/xash3d.ipa \
            artifacts/XashFusion-iOS-ARM64.ipa

          ls -lh artifacts/XashFusion-iOS-ARM64.ipa

      # ------------------------------------------------------------
      # Final IPA inspection
      # ------------------------------------------------------------
      - name: Verify IPA contents
        shell: bash
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/ipa-check"

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q \
            artifacts/XashFusion-iOS-ARM64.ipa \
            -d "$RUNNER_TEMP/ipa-check"

          echo "===== IPA FILES ====="

          find "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

          echo ""
          echo "===== APP BUNDLE ====="

          APP="$(
            find "$RUNNER_TEMP/ipa-check/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              | head -n 1
          )"

          test -n "$APP"

          echo "APP=$APP"

          test -f "$APP/xash"

          echo ""
          echo "===== ENGINE ====="

          file "$APP/xash"

          lipo -info "$APP/xash" || true

          echo ""
          echo "===== SDL2 ====="

          test -f "$APP/SDL2.framework/SDL2"

          file "$APP/SDL2.framework/SDL2"

      # ------------------------------------------------------------
      # Upload final IPA
      # ------------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-ARM64
          path: ${{ runner.temp }}/xash3d-fwgs/artifacts/XashFusion-iOS-ARM64.ipa
          if-no-files-found: error
