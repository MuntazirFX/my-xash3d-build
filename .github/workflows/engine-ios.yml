name: XashFusion - iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Xash3D-FWGS iOS ARM64
    runs-on: macos-latest

    env:
      SDL_VERSION: 2.32.10

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare official FWGS engine source
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/xash3d-fwgs"

          git clone \
            --recursive \
            --depth=1 \
            https://github.com/FWGS/xash3d-fwgs \
            "$RUNNER_TEMP/xash3d-fwgs"

          echo "FWGS source:"
          ls -la "$RUNNER_TEMP/xash3d-fwgs"

          echo "Checking libbacktrace:"
          test -d "$RUNNER_TEMP/xash3d-fwgs/3rdparty/libbacktrace/libbacktrace"

      - name: Install Python
        run: |
          brew install python

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Build SDL2 iOS framework
        run: |
          set -e

          git clone \
            --recursive \
            --branch "release-${SDL_VERSION}" \
            --depth=1 \
            https://github.com/libsdl-org/SDL \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          xcodebuild \
            -scheme xcFramework-iOS \
            -target xcFramework-iOS \
            build \
            -configuration Release

          test -f \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework/SDL2

          sudo mkdir -p /Library/Frameworks

          sudo cp -R \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework \
            /Library/Frameworks/

      - name: Verify SDL2
        run: |
          set -e

          test -f /Library/Frameworks/SDL2.framework/SDL2

          file /Library/Frameworks/SDL2.framework/SDL2

      - name: Build Xash3D-FWGS engine
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          ./waf configure \
            --enable-lto \
            --ios

          ./waf build

          ./waf install \
            --destdir=build/ios

      - name: Verify engine build
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          echo "===== BUILD DIRECTORY ====="
          find build/ios -type f -print

          echo ""
          echo "===== ENGINE BUILD ====="
          find build -type f -print | head -200

      - name: Prepare SDL2 for IPA
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          rm -rf build/SDL2.framework

          cp -R \
            /Library/Frameworks/SDL2.framework \
            build/SDL2.framework

          test -f build/SDL2.framework/SDL2

      - name: Build Half-Life SDK libraries
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          git clone \
            --recursive \
            --branch mobile_hacks \
            --depth=1 \
            https://github.com/FWGS/hlsdk-portable \
            hlsdk

          mkdir -p build/ios/libs

          cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_INSTALL_PREFIX="$(realpath build/ios/libs)" \
            -DCMAKE_BUILD_TYPE=Debug \
            -B hlsdk/build \
            -S hlsdk

          cmake \
            --build hlsdk/build \
            --target install

      - name: Inspect game libraries
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          echo "===== iOS LIBRARIES ====="
          find build/ios/libs -type f -print || true

      - name: Create IPA
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          ./scripts/ios/createipa.sh

          test -f build/xash3d.ipa

      - name: Rename IPA
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          mkdir -p artifacts

          mv \
            build/xash3d.ipa \
            artifacts/XashFusion-iOS-ARM64.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-ARM64
          path: ${{ runner.temp }}/xash3d-fwgs/artifacts/XashFusion-iOS-ARM64.ipa
          if-no-files-found: error
