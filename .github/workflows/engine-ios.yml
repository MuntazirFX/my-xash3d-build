name: Build XashFusion iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build XashFusion iOS ARM64
    runs-on: macos-latest

    env:
      SDL_VERSION: "2.32.10"
      IOS_DEPLOYMENT_TARGET: "15.0"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # =========================================================
      # 2. VERIFY REPOSITORY
      # =========================================================

      - name: Verify repository
        run: |
          set -euxo pipefail

          echo "===== REPOSITORY ====="
          pwd
          ls -la

          echo "===== ENGINE ====="
          test -f engine/waf
          test -f engine/wscript
          ls -la engine

          echo "===== HLSDK ====="
          if [ -d hlsdk ]; then
            ls -la hlsdk
          else
            echo "HLSDK directory not found"
          fi

      # =========================================================
      # 3. INITIALIZE ENGINE SUBMODULES
      # =========================================================

      - name: Initialize engine submodules
        working-directory: engine
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "===== SUBMODULE STATUS ====="
          git submodule status --recursive

          echo "===== LIBBACKTRACE ====="

          if [ ! -d 3rdparty/libbacktrace ]; then
            echo "ERROR: libbacktrace directory missing"
            exit 1
          fi

          find 3rdparty/libbacktrace \
            -maxdepth 2 \
            -print \
            | head -100

      # =========================================================
      # 4. VERIFY LIBBACKTRACE
      # =========================================================

      - name: Verify libbacktrace
        working-directory: engine
        run: |
          set -euxo pipefail

          test -d 3rdparty/libbacktrace

          echo "libbacktrace OK"

      # =========================================================
      # 5. XCODE
      # =========================================================

      - name: Select Xcode
        run: |
          set -euxo pipefail

          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer

          echo "===== XCODE ====="

          xcodebuild -version
          xcode-select -p

      # =========================================================
      # 6. DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            python \
            cmake \
            pkg-config

          python3 --version
          cmake --version
          pkg-config --version

      # =========================================================
      # 7. SDL2
      # =========================================================

      - name: Checkout SDL2
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/SDL"

          git clone \
            --depth=1 \
            --branch "release-${SDL_VERSION}" \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL"

          echo "===== SDL VERSION ====="
          git describe --tags --always
          git rev-parse HEAD

      # =========================================================
      # 8. SHOW SDL PROJECT
      # =========================================================

      - name: Inspect SDL Xcode project
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/SDL"

          xcodebuild \
            -project Xcode/SDL/SDL.xcodeproj \
            -list

      # =========================================================
      # 9. BUILD SDL2 XCFRAMEWORK
      # =========================================================

      - name: Build SDL2 iOS ARM64
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          echo "===== BUILD SDL2 ====="

          xcodebuild \
            -project SDL.xcodeproj \
            -scheme xcFramework-iOS \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            build

      # =========================================================
      # 10. LOCATE SDL2
      # =========================================================

      - name: Locate SDL2 framework
        run: |
          set -euxo pipefail

          echo "===== FRAMEWORKS ====="

          find "$RUNNER_TEMP/SDL" \
            -type d \
            -name "*.framework" \
            -print

          echo "===== SDL2 BINARIES ====="

          find "$RUNNER_TEMP/SDL" \
            -type f \
            -name "SDL2" \
            -print

      # =========================================================
      # 11. PREPARE SDL2
      # =========================================================

      - name: Prepare SDL2 framework
        run: |
          set -euxo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/build/SDL2"

          SDL_FRAMEWORK="$(
            find "$RUNNER_TEMP/SDL" \
              -type d \
              -path "*/Products/*/SDL2.framework" \
              | head -1
          )"

          if [ -z "$SDL_FRAMEWORK" ]; then

            echo "ERROR: SDL2.framework not found"

            find "$RUNNER_TEMP/SDL" \
              -type d \
              -name "*.framework" \
              -print

            exit 1
          fi

          echo "===== SDL FRAMEWORK ====="
          echo "$SDL_FRAMEWORK"

          rm -rf \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework"

          cp -R \
            "$SDL_FRAMEWORK" \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework"

          test -f \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework/SDL2"

          echo "===== SDL2 BINARY ====="

          file \
            "$GITHUB_WORKSPACE/build/SDL2/SDL2.framework/SDL2"

      # =========================================================
      # 12. CONFIGURE XASH3D-FWGS
      # =========================================================

      - name: Configure Xash3D-FWGS iOS ARM64
        working-directory: engine
        run: |
          set -euxo pipefail

          echo "===== WAF ====="

          ./waf --version

          echo "===== CONFIGURE ====="

          ./waf configure \
            --ios \
            --arch=arm64 \
            --enable-bundled-deps \
            --enable-lto \
            --sdl2="$GITHUB_WORKSPACE/build/SDL2/SDL2.framework"

      # =========================================================
      # 13. BUILD ENGINE
      # =========================================================

      - name: Build Xash3D-FWGS ARM64
        working-directory: engine
        run: |
          set -euxo pipefail

          echo "===== BUILD XASH3D-FWGS ====="

          ./waf build \
            -v \
            -j2

      # =========================================================
      # 14. CREATE INSTALL DIRECTORY
      # =========================================================

      - name: Install Xash3D-FWGS
        working-directory: engine
        run: |
          set -euxo pipefail

          echo "===== PREPARE INSTALL DIRECTORY ====="

          rm -rf \
            "$GITHUB_WORKSPACE/build/xash-install"

          mkdir -p \
            "$GITHUB_WORKSPACE/build/xash-install"

          test -d \
            "$GITHUB_WORKSPACE/build/xash-install"

          echo "===== WAF INSTALL ====="

          ./waf install \
            --destdir="$GITHUB_WORKSPACE/build/xash-install"

      # =========================================================
      # 15. INSPECT ENGINE OUTPUT
      # =========================================================

      - name: Inspect engine output
        run: |
          set -euxo pipefail

          echo "===== INSTALLED FILES ====="

          find build/xash-install \
            -type f \
            -print \
            | sort

          echo ""
          echo "===== MACH-O FILES ====="

          find build/xash-install \
            -type f \
            -exec file {} \; \
            | grep -E "Mach-O" \
            || true

      # =========================================================
      # 16. VERIFY ARM64
      # =========================================================

      - name: Verify ARM64 engine
        run: |
          set -euxo pipefail

          ENGINE_FOUND=0

          while IFS= read -r -d '' FILE; do

            INFO="$(file "$FILE")"

            echo "$INFO"

            if echo "$INFO" | grep -Eq \
              "Mach-O.*arm64|Mach-O 64-bit.*arm64"; then

              ENGINE_FOUND=1

            fi

          done < <(
            find build/xash-install \
              -type f \
              -print0
          )

          if [ "$ENGINE_FOUND" -eq 0 ]; then
            echo "ERROR: No ARM64 Mach-O binary found"
            exit 1
          fi

          echo "ARM64 engine verified"

      # =========================================================
      # 17. CHECK HLSDK
      # =========================================================

      - name: Check HLSDK source
        run: |
          set -euxo pipefail

          echo "===== HLSDK ====="

          for DIR in \
            valve \
            bshift \
            gearbox \
            cstrike \
            cstrike-server \
            czero \
            czero-server
          do

            if [ -d "hlsdk/$DIR" ]; then
              echo "FOUND: hlsdk/$DIR"
            else
              echo "MISSING: hlsdk/$DIR"
            fi

          done

      # =========================================================
      # 18. PREPARE ARTIFACT
      # =========================================================

      - name: Prepare engine artifact
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p \
            artifacts/xash3d

          cp -R \
            build/xash-install/. \
            artifacts/xash3d/

          cp -R \
            build/SDL2/SDL2.framework \
            artifacts/xash3d/

          echo "===== ARTIFACT CONTENTS ====="

          find artifacts/xash3d \
            -type f \
            -print \
            | sort

      # =========================================================
      # 19. CREATE ARCHIVE
      # =========================================================

      - name: Create engine archive
        run: |
          set -euxo pipefail

          cd artifacts

          tar -czf \
            XashFusion-iOS-ARM64-engine.tar.gz \
            xash3d

          test -f \
            XashFusion-iOS-ARM64-engine.tar.gz

          ls -lh \
            XashFusion-iOS-ARM64-engine.tar.gz

      # =========================================================
      # 20. UPLOAD ARTIFACT
      # =========================================================

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-ARM64-engine
          path: artifacts/XashFusion-iOS-ARM64-engine.tar.gz
          if-no-files-found: error
