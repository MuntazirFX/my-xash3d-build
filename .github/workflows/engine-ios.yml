name: XashFusion - iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build XashFusion iOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout official FWGS source with dependencies
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/xash3d-fwgs"

          git clone --recursive --depth=1 \
            https://github.com/FWGS/xash3d-fwgs \
            "$RUNNER_TEMP/xash3d-fwgs"

          test -d "$RUNNER_TEMP/xash3d-fwgs/3rdparty/libbacktrace/libbacktrace"

      - name: Install build dependencies
        run: |
          brew install python cmake

      - name: Build SDL2 iOS
        run: |
          set -e

          git clone --recursive \
            --depth=1 \
            --branch SDL2 \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          xcodebuild \
            -scheme SDL2 \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

          SDL_FRAMEWORK="$(find . -type d -name SDL2.framework | head -1)"

          test -n "$SDL_FRAMEWORK"

          rm -rf "$RUNNER_TEMP/SDL2.framework"
          cp -R "$SDL_FRAMEWORK" "$RUNNER_TEMP/SDL2.framework"

          test -f "$RUNNER_TEMP/SDL2.framework/SDL2"

      - name: Build Xash3D-FWGS
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          cp -R \
            "$RUNNER_TEMP/SDL2.framework" \
            ./SDL2.framework

          ./waf configure \
            --ios \
            --enable-bundled-deps \
            --enable-lto \
            --sdl2="$(realpath SDL2.framework)"

          ./waf build

          rm -rf build/ios

          ./waf install \
            --destdir=build/ios

      - name: Build Half-Life ARM64 libraries
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          rm -rf hlsdk

          git clone --recursive \
            --depth=1 \
            --branch mobile_hacks \
            https://github.com/FWGS/hlsdk-portable \
            hlsdk

          mkdir -p build/ios/libs

          cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$(realpath build/ios/libs)" \
            -B hlsdk/build \
            -S hlsdk

          cmake \
            --build hlsdk/build \
            --target install \
            --parallel

      - name: Verify generated libraries
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          echo "===== GENERATED IOS LIBRARIES ====="
          find build/ios/libs -type f -print

          echo ""
          echo "===== MACH-O ====="

          find build/ios/libs -type f -name "*.dylib" -print0 |
          while IFS= read -r -d '' f; do
            echo "--- $f"
            file "$f"
          done

      - name: Prepare SDL2 framework
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          cp -R \
            "$RUNNER_TEMP/SDL2.framework" \
            build/SDL2.framework

          test -f build/SDL2.framework/SDL2

      - name: Create iOS IPA
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          ./scripts/ios/createipa.sh

          test -f build/xash3d.ipa

      - name: Rename IPA
        working-directory: ${{ runner.temp }}/xash3d-fwgs
        run: |
          set -e

          mkdir -p artifacts

          mv \
            build/xash3d.ipa \
            artifacts/XashFusion-iOS-ARM64.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-ARM64
          path: ${{ runner.temp }}/xash3d-fwgs/artifacts/XashFusion-iOS-ARM64.ipa
          if-no-files-found: error
