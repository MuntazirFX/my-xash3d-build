name: XashFusion - iOS ARM64

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build XashFusion iOS ARM64
    runs-on: macos-latest

    env:
      SDL_VERSION: 2.32.10

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify XashFusion source
        run: |
          set -e

          test -f engine/waf
          test -f engine/wscript

          echo "XashFusion engine source OK"

          echo "===== Engine ====="
          find engine -maxdepth 2 -type d | sort

          echo "===== HLSDK ====="
          find hlsdk -maxdepth 2 -type d | sort

      - name: Initialize engine dependencies
        working-directory: engine
        run: |
          set -e

          git submodule sync --recursive || true
          git submodule update --init --recursive || true

          echo "===== libbacktrace ====="
          find 3rdparty/libbacktrace -maxdepth 3 -type f 2>/dev/null | head -50 || true

      - name: Install build dependencies
        run: |
          brew install python

      - name: Build SDL2 iOS
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/SDL"

          git clone \
            --depth=1 \
            --branch "release-${SDL_VERSION}" \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          xcodebuild \
            -scheme xcFramework-iOS \
            -target xcFramework-iOS \
            build \
            -configuration Release

          test -f \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework/SDL2

          sudo mkdir -p /Library/Frameworks

          sudo cp -R \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework \
            /Library/Frameworks/SDL2.framework

      - name: Verify SDL2
        run: |
          set -e

          test -f /Library/Frameworks/SDL2.framework/SDL2

          file /Library/Frameworks/SDL2.framework/SDL2

      - name: Configure Xash3D-FWGS
        working-directory: engine
        run: |
          set -e

          ./waf configure \
            --enable-lto \
            --ios \
            --enable-bundled-deps \
            --sdl2=/Library/Frameworks/SDL2.framework

      - name: Build Xash3D-FWGS
        working-directory: engine
        run: |
          set -e

          ./waf build -v

      - name: Install Xash3D-FWGS
        working-directory: engine
        run: |
          set -e

          rm -rf ../build/ios

          ./waf install \
            --destdir=../build/ios

      - name: Inspect engine output
        run: |
          set -e

          echo "===== XASHFUSION BUILD OUTPUT ====="

          find build/ios -type f -print || true

          echo ""
          echo "===== ENGINE BUILD FILES ====="

          find engine/build -type f -print | head -200 || true

      - name: Verify ARM64 engine
        run: |
          set -e

          echo "===== MACH-O BINARIES ====="

          found=0

          while IFS= read -r file_path; do
            info="$(file "$file_path")"

            echo "$info"

            if echo "$info" | grep -Eq 'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              found=1
            fi

          done < <(
            find build/ios engine/build -type f 2>/dev/null
          )

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No ARM64 Mach-O engine binary found."
            exit 1
          fi

      - name: Prepare SDL2 framework
        run: |
          set -e

          rm -rf build/SDL2.framework

          cp -R \
            /Library/Frameworks/SDL2.framework \
            build/SDL2.framework

          test -f build/SDL2.framework/SDL2

      - name: Build HLSDK libraries
        working-directory: hlsdk
        run: |
          set -e

          mkdir -p ../build/ios/libs

          cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$(realpath ../build/ios/libs)" \
            -B build \
            -S .

          cmake \
            --build build \
            --target install \
            --parallel

      - name: Inspect game libraries
        run: |
          echo "===== GAME LIBRARIES ====="

          find build/ios/libs -type f -print || true

          echo ""
          echo "===== DYLIB ARCHITECTURES ====="

          find build/ios/libs -type f -name "*.dylib" -print0 |
          while IFS= read -r -d '' f; do
            echo "--- $f"
            file "$f"
          done

      - name: Create IPA
        working-directory: engine
        run: |
          set -e

          ./scripts/ios/createipa.sh

          test -f build/xash3d.ipa

      - name: Rename IPA
        working-directory: engine
        run: |
          set -e

          mkdir -p artifacts

          mv \
            build/xash3d.ipa \
            artifacts/XashFusion-iOS-ARM64.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-ARM64
          path: engine/artifacts/XashFusion-iOS-ARM64.ipa
          if-no-files-found: error
