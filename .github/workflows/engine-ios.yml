name: XashFusion - iOS Engine ARM64

on:
  workflow_dispatch:

jobs:
  build-engine:
    name: Build Xash3D-FWGS iOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize engine submodules
        working-directory: engine
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify engine source
        working-directory: engine
        run: |
          test -f waf
          test -f wscript
          test -d 3rdparty/libbacktrace
          echo "FWGS engine source OK"
          echo "libbacktrace OK"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          xcodebuild -version
          clang --version
          python3 --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build SDL2 for iOS ARM64
        run: |
          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            "$RUNNER_TEMP/SDL"

          cd "$RUNNER_TEMP/SDL/Xcode/SDL"

          xcodebuild \
            -scheme xcFramework-iOS \
            -target xcFramework-iOS \
            -configuration Release \
            build

          test -f \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework/SDL2

          mkdir -p "$RUNNER_TEMP/SDL-install"

          cp -R \
            Products/SDL2.xcframework/ios-arm64/SDL2.framework \
            "$RUNNER_TEMP/SDL-install/SDL2.framework"

      - name: Verify SDL2 ARM64
        run: |
          test -f \
            "$RUNNER_TEMP/SDL-install/SDL2.framework/SDL2"

          file \
            "$RUNNER_TEMP/SDL-install/SDL2.framework/SDL2"

      - name: Configure Xash3D-FWGS
        working-directory: engine
        run: |
          python3 ./waf configure \
            --ios \
            --enable-lto

      - name: Build Xash3D-FWGS
        working-directory: engine
        run: |
          python3 ./waf build -v

      - name: Install Xash3D-FWGS
        working-directory: engine
        run: |
          rm -rf ../build/ios

          python3 ./waf install \
            --destdir="../build/ios"

      - name: Inspect engine output
        run: |
          echo "===== build/ios ====="
          find build/ios -type f -print

          echo ""
          echo "===== executable files ====="
          find build/ios -type f -perm -111 -print || true

          echo ""
          echo "===== engine build ====="
          find engine/build -type f -print | head -200

      - name: Verify actual ARM64 engine binary
        run: |
          set -e

          found=0

          while IFS= read -r binary; do
            echo "Checking: $binary"

            if file "$binary" | grep -Eq \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then

              echo "FOUND ARM64 MACH-O: $binary"
              found=1
            fi
          done < <(
            find build/ios engine/build \
              -type f \
              2>/dev/null
          )

          if [ "$found" -ne 1 ]; then
            echo ""
            echo "ERROR: Actual iOS ARM64 engine binary was not produced."
            echo "Build will stop here."
            exit 1
          fi

      - name: Prepare engine artifact
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp -R build/ios artifact/xash3d-ios-arm64

          cp -R \
            "$RUNNER_TEMP/SDL-install/SDL2.framework" \
            artifact/xash3d-ios-arm64/SDL2.framework

      - name: Show final artifact
        run: |
          echo "===== FINAL ARTIFACT ====="
          find artifact -type f -print

      - name: Upload iOS ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-iOS-engine-arm64
          path: artifact/xash3d-ios-arm64
          if-no-files-found: error
