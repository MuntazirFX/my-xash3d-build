name: Build Libraries iOS ARM64

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        type: choice
        options:
          - all
          - engine-only
          - hlsdk-only
        default: all

permissions:
  contents: write

jobs:
  build-libraries:
    name: Build ARM64 Libraries
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          python3 --version
          uname -a

      - name: Install dependencies
        run: |
          brew install python@3.11 p7zip cmake ninja

      - name: Download SDL2 iOS framework
        run: |
          mkdir -p ios/SDL2
          cd ios/SDL2
          curl -L -o SDL2.dmg "https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.dmg"
          7z x SDL2.dmg -o./extracted -y > /dev/null
          FOUND=$(find ./extracted -name "SDL2.framework" -type d | head -1)
          if [ -n "$FOUND" ]; then
            cp -R "$FOUND" ./
            echo "SDL2.framework copied"
          else
            echo "SDL2.framework not found"
            exit 1
          fi
          rm -rf extracted SDL2.dmg
          ls -la

      - name: Verify source
        run: |
          ls engine/ | head -20
          ls hlsdk/
          for game in valve bshift gearbox cstrike czero; do
            if [ -d "hlsdk/$game" ]; then
              echo "OK: hlsdk/$game"
            else
              echo "MISSING: hlsdk/$game"
            fi
          done

      - name: Configure engine
        if: ${{ github.event.inputs.target != 'hlsdk-only' }}
        working-directory: engine
        run: |
          chmod +x waf
          python3 ./waf configure --ios --sdl2="$(pwd)/../ios/SDL2/SDL2.framework" --enable-bundled-deps --disable-werror 2>&1 | tee /tmp/engine_conf.log || echo "engine configure returned non-zero"

      - name: Build engine
        if: ${{ github.event.inputs.target != 'hlsdk-only' }}
        working-directory: engine
        run: |
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/engine_build.log || echo "engine build returned non-zero"

      - name: Collect engine libraries
        if: ${{ github.event.inputs.target != 'hlsdk-only' }}
        run: |
          mkdir -p artifacts/engine
          find engine -name "*.dylib" -exec cp {} artifacts/engine/ \; 2>/dev/null || true
          find engine -name "xash3d" -type f -exec cp {} artifacts/engine/ \; 2>/dev/null || true
          ls -la artifacts/engine/ || true

      - name: Build valve
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/valve
        run: |
          python3 ./waf configure --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" --disable-werror 2>&1 | tee /tmp/valve_conf.log || echo "valve configure returned non-zero"
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/valve_build.log || echo "valve build returned non-zero"

      - name: Build bshift
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/bshift
        run: |
          python3 ./waf configure --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" --disable-werror 2>&1 | tee /tmp/bshift_conf.log || echo "bshift configure returned non-zero"
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/bshift_build.log || echo "bshift build returned non-zero"

      - name: Build gearbox
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/gearbox
        run: |
          python3 ./waf configure --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" --disable-werror 2>&1 | tee /tmp/gearbox_conf.log || echo "gearbox configure returned non-zero"
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/gearbox_build.log || echo "gearbox build returned non-zero"

      - name: Build cstrike
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/cstrike
        run: |
          python3 ./waf configure --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" --disable-werror 2>&1 | tee /tmp/cstrike_conf.log || echo "cstrike configure returned non-zero"
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/cstrike_build.log || echo "cstrike build returned non-zero"

      - name: Build czero
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/czero
        run: |
          python3 ./waf configure --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" --disable-werror 2>&1 | tee /tmp/czero_conf.log || echo "czero configure returned non-zero"
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/czero_build.log || echo "czero build returned non-zero"

      - name: Collect hlsdk libraries
        if: ${{ github.event.inputs.target != 'engine-only' }}
        run: |
          for game in valve bshift gearbox cstrike czero; do
            mkdir -p "artifacts/hlsdk/$game"
            if [ -d "hlsdk/$game" ]; then
              find "hlsdk/$game" -name "*.dylib" -exec cp {} "artifacts/hlsdk/$game/" \; 2>/dev/null || true
              find "hlsdk/$game" -name "*.so" -exec cp {} "artifacts/hlsdk/$game/" \; 2>/dev/null || true
            fi
            ls -la "artifacts/hlsdk/$game/" 2>/dev/null || true
          done

      - name: List all artifacts
        run: |
          echo "=== All artifacts ==="
          find artifacts -type f | while read f; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "$SIZE  $f"
          done
          echo ""
          echo "Total files:"
          find artifacts -type f | wc -l

      - name: Upload libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-Libraries
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: /tmp/*.log
          retention-days: 7
          if-no-files-found: ignore
