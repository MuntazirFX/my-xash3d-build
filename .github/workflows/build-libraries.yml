# build-libraries.yml
# Builds all Xash3D iOS ARM64 libraries (.dylib) from vendored source.
# Output: 15 libraries in artifacts/
# XashFusion · Clean-room.

name: Build Libraries (iOS ARM64)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        type: choice
        options:
          - all
          - engine-only
          - hlsdk-only
        default: all

permissions:
  contents: write

jobs:
  build-libraries:
    name: Build ARM64 Libraries
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      # ============================================================
      # 1. SETUP
      # ============================================================
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show environment
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo ""
          echo "=== Python ==="
          python3 --version
          echo ""
          echo "=== Host ==="
          uname -a

      - name: Install dependencies
        run: |
          brew install python@3.11 p7zip cmake ninja

      # ============================================================
      # 2. SDL2 iOS FRAMEWORK
      # ============================================================
      - name: Download SDL2 for iOS
        run: |
          mkdir -p ios/SDL2
          cd ios/SDL2
          echo "Downloading SDL2 2.30.3 iOS..."
          curl -L -o SDL2.dmg \
            "https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.dmg"
          echo "Extracting..."
          7z x SDL2.dmg -o./extracted -y > /dev/null
          # Find SDL2.framework
          FOUND=$(find ./extracted -name "SDL2.framework" -type d | head -1)
          if [ -n "$FOUND" ]; then
            cp -R "$FOUND" ./
            echo "✅ SDL2.framework copied"
          else
            echo "❌ SDL2.framework not found"
            ls -R ./extracted | head -50
            exit 1
          fi
          rm -rf extracted SDL2.dmg
          ls -la

      # ============================================================
      # 3. VERIFY SOURCE EXISTS
      # ============================================================
      - name: Verify source folders
        run: |
          echo "=== engine/ ==="
          test -d engine && ls engine/ | head -20 || (echo "❌ engine/ missing" && exit 1)
          echo ""
          echo "=== hlsdk/ ==="
          test -d hlsdk && ls hlsdk/ || (echo "❌ hlsdk/ missing" && exit 1)
          echo ""
          for game in valve bshift gearbox cstrike czero; do
            if [ -d "hlsdk/$game" ]; then
              echo "✅ hlsdk/$game exists"
            else
              echo "⚠️  hlsdk/$game missing"
            fi
          done

      # ============================================================
      # 4. BUILD ENGINE
      # ============================================================
      - name: Configure Xash3D engine (iOS ARM64)
        if: ${{ github.event.inputs.target != 'hlsdk-only' }}
        working-directory: engine
        run: |
          chmod +x waf
          python3 ./waf configure \
            --ios \
            --sdl2="$(pwd)/../ios/SDL2/SDL2.framework" \
            --enable-bundled-deps \
            --disable-werror \
            2>&1 | tee /tmp/engine_configure.log || {
              echo "=== CONFIGURE FAILED ==="
              tail -100 /tmp/engine_configure.log
              exit 1
            }

      - name: Build Xash3D engine
        if: ${{ github.event.inputs.target != 'hlsdk-only' }}
        working-directory: engine
        run: |
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/engine_build.log || {
            echo "=== BUILD FAILED ==="
            tail -100 /tmp/engine_build.log
            exit 1
          }

      - name: Collect engine libraries
        if: ${{ github.event.inputs.target != 'hlsdk-only' }}
        run: |
          mkdir -p artifacts/engine
          # Find all built dylibs from engine
          find engine -name "*.dylib" -exec cp {} artifacts/engine/ \; 2>/dev/null || true
          # Also copy binary
          find engine -name "xash3d" -type f -exec cp {} artifacts/engine/ \; 2>/dev/null || true
          echo "=== Engine artifacts ==="
          ls -la artifacts/engine/ || echo "(empty)"

      # ============================================================
      # 5. BUILD HLSDK (each game separately)
      # ============================================================
      - name: Build HLSDK — Half-Life (valve)
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/valve
        run: |
          echo "=== Configuring valve ==="
          python3 ./waf configure \
            --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" \
            --disable-werror \
            2>&1 | tee /tmp/valve_configure.log || echo "configure returned non-zero"
          echo "=== Building valve ==="
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/valve_build.log || echo "build returned non-zero"

      - name: Build HLSDK — Blue Shift (bshift)
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/bshift
        run: |
          echo "=== Configuring bshift ==="
          python3 ./waf configure \
            --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" \
            --disable-werror \
            2>&1 | tee /tmp/bshift_configure.log || echo "configure returned non-zero"
          echo "=== Building bshift ==="
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/bshift_build.log || echo "build returned non-zero"

      - name: Build HLSDK — Opposing Force (gearbox)
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/gearbox
        run: |
          echo "=== Configuring gearbox ==="
          python3 ./waf configure \
            --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" \
            --disable-werror \
            2>&1 | tee /tmp/gearbox_configure.log || echo "configure returned non-zero"
          echo "=== Building gearbox ==="
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/gearbox_build.log || echo "build returned non-zero"

      - name: Build HLSDK — CS 1.6 (cstrike)
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/cstrike
        run: |
          echo "=== Configuring cstrike ==="
          python3 ./waf configure \
            --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" \
            --disable-werror \
            2>&1 | tee /tmp/cstrike_configure.log || echo "configure returned non-zero"
          echo "=== Building cstrike ==="
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/cstrike_build.log || echo "build returned non-zero"

      - name: Build HLSDK — CS: Condition Zero (czero)
        if: ${{ github.event.inputs.target != 'engine-only' }}
        working-directory: hlsdk/czero
        run: |
          echo "=== Configuring czero ==="
          python3 ./waf configure \
            --sdl2="$(pwd)/../../../ios/SDL2/SDL2.framework" \
            --disable-werror \
            2>&1 | tee /tmp/czero_configure.log || echo "configure returned non-zero"
          echo "=== Building czero ==="
          python3 ./waf build -j$(sysctl -n hw.ncpu) 2>&1 | tee /tmp/czero_build.log || echo "build returned non-zero"

      # ============================================================
      # 6. COLLECT ALL LIBRARIES
      # ============================================================
      - name: Collect HLSDK libraries
        if: ${{ github.event.inputs.target != 'engine-only' }}
        run: |
          for game in valve bshift gearbox cstrike czero; do
            mkdir -p "artifacts/hlsdk/$game"
            if [ -d "hlsdk/$game" ]; then
              find "hlsdk/$game" -name "*.dylib" -exec cp {} "artifacts/hlsdk/$game/" \; 2>/dev/null || true
              find "hlsdk/$game" -name "*.so" -exec cp {} "artifacts/hlsdk/$game/" \; 2>/dev/null || true
            fi
            echo "=== $game artifacts ==="
            ls -la "artifacts/hlsdk/$game/" 2>/dev/null || echo "(empty)"
          done

      # ============================================================
      # 7. SUMMARY REPORT
      # ============================================================
      - name: Generate build report
        if: always()
        run: |
          echo "# XashFusion Library Build Report" > /tmp/report.md
          echo "" >> /tmp/report.md
          echo "**Commit:** \`${{ github.sha }}\`" >> /tmp/report.md
          echo "**Date:** $(date -u)" >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "## Libraries Found" >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "| Path | File | Size |" >> /tmp/report.md
          echo "|------|------|------|" >> /tmp/report.md
          find artifacts -type f \( -name "*.dylib" -o -name "xash3d" -o -name "*.so" \) | while read f; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "| \`$f\` | $(basename "$f") | $SIZE |" >> /tmp/report.md
          done
          echo "" >> /tmp/report.md
          echo "**Total:** $(find artifacts -type f | wc -l) files" >> /tmp/report.md
          cat /tmp/report.md
          cat /tmp/report.md >> $GITHUB_STEP_SUMMARY

      # ============================================================
      # 8. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload all libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XashFusion-Libraries-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs-${{ github.sha }}
          path: |
            /tmp/*_configure.log
            /tmp/*_build.log
          retention-days: 7
          if-no-files-found: ignore
