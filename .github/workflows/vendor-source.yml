name: Vendor Source Code Into Repo

# Manual-trigger only - this is a one-time (or occasional) housekeeping
# task, not something that should run on every push like the build
# workflow does.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone engine source (FWGS/xash3d-fwgs, master)
        run: |
          rm -rf engine
          git clone --depth 1 https://github.com/FWGS/xash3d-fwgs engine
          rm -rf engine/.git
          echo "--- Verifying engine/ ---"
          ls -la engine/
          echo "--- Verifying engine/platform/ ---"
          ls -la engine/platform/

      - name: Clone hlsdk-portable - valve (master branch)
        run: |
          rm -rf hlsdk-valve
          git clone --depth 1 -b master https://github.com/FWGS/hlsdk-portable hlsdk-valve
          rm -rf hlsdk-valve/.git
          echo "--- Verifying hlsdk-valve/ ---"
          ls -la hlsdk-valve/

      - name: Clone hlsdk-portable - gearbox (opfor branch)
        run: |
          rm -rf hlsdk-gearbox
          git clone --depth 1 -b opfor https://github.com/FWGS/hlsdk-portable hlsdk-gearbox
          rm -rf hlsdk-gearbox/.git
          echo "--- Verifying hlsdk-gearbox/ ---"
          ls -la hlsdk-gearbox/

      - name: Clone hlsdk-portable - bshift (bshift branch)
        run: |
          rm -rf hlsdk-bshift
          git clone --depth 1 -b bshift https://github.com/FWGS/hlsdk-portable hlsdk-bshift
          rm -rf hlsdk-bshift/.git
          echo "--- Verifying hlsdk-bshift/ ---"
          ls -la hlsdk-bshift/

      - name: Strip non-iOS platform folders (this device only builds iOS)
        run: |
          echo "--- Working directory ---"
          pwd
          echo "--- Top-level contents before stripping ---"
          ls -la

          rm -rf engine/android
          rm -rf hlsdk-valve/android hlsdk-gearbox/android hlsdk-bshift/android

          if [ -d engine/platform ]; then
            for d in android dos irix linux nswitch psvita sdl1 sdl3 win32; do
              rm -rf "engine/platform/$d"
            done
            echo "Remaining engine/platform/ folders (should be iOS-relevant only):"
            ls engine/platform/
          else
            echo "::warning::engine/platform/ not found - skipping platform-folder strip. Check the 'Clone engine source' step's verification output above for what went wrong."
          fi

      - name: Write README explaining what's vendored here
        run: |
          cat > VENDORED_SOURCE.md << 'EOF'
          # Vendored source code

          The build workflow (`.github/workflows/main.yml`) builds from
          **this repo's own copy** of the engine and game SDK, not by
          fetching FWGS's repos fresh on every run. This folder set is
          that copy - both the browsable source *and* the actual build
          input.

          - `engine/` - Xash3D-FWGS engine
            ([FWGS/xash3d-fwgs](https://github.com/FWGS/xash3d-fwgs), `master`)
          - `hlsdk-valve/` - Half-Life SDK, `master` branch
            ([FWGS/hlsdk-portable](https://github.com/FWGS/hlsdk-portable)) -> `valve` gamedir
          - `hlsdk-gearbox/` - same repo, `opfor` branch -> `gearbox` gamedir (Opposing Force)
          - `hlsdk-bshift/` - same repo, `bshift` branch -> `bshift` gamedir (Blue Shift)

          **Not included:** other platforms' code (Android, Windows,
          Linux, PS Vita, Switch, etc. - stripped out since this repo
          only ever builds for iOS), game content
          (maps/models/textures/sounds - copyrighted, comes from a
          legally-owned Steam install), and built `.ipa` files
          (published to this repo's Releases, never committed to the
          source tree).

          This snapshot was pulled by the "Vendor Source Code Into Repo"
          workflow, run manually, not on every push. Re-run it any time
          you want to refresh these folders to upstream's latest -
          doing so will change what the *next* build compiles from.
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in engine hlsdk-valve hlsdk-gearbox hlsdk-bshift VENDORED_SOURCE.md; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "No changes - source already up to date."
          else
            git commit -m "Vendor engine + hlsdk-portable (valve/gearbox/bshift) source [skip ci]"
            git push
          fi
