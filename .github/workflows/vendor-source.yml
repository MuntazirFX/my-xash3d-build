name: Vendor Source Code

on:
  workflow_dispatch:
    inputs:
      include_cstrike:
        description: 'Also vendor cstrike + czero SDKs'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  vendor:
    name: Vendor FWGS + HLSDK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout XashFusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          git --version
          echo "Start: $(date -u)"

      # --------------------------------------------------
      # 1. Vendor Xash3D-FWGS engine
      # --------------------------------------------------
      - name: Clone Xash3D-FWGS
        run: |
          git clone --depth=1 https://github.com/FWGS/xash3d-fwgs.git /tmp/fwgs
          rm -rf /tmp/fwgs/.git /tmp/fwgs/.github
          mkdir -p engine
          cp -R /tmp/fwgs/. engine/
          echo "engine/ ready"
          ls engine/ | head -30

      # --------------------------------------------------
      # 2. Vendor HLSDK-Portable (valve = master branch)
      # --------------------------------------------------
      - name: Clone HLSDK valve (master)
        run: |
          git clone --depth=1 --branch master https://github.com/FWGS/hlsdk-portable.git /tmp/hl-valve
          rm -rf /tmp/hl-valve/.git /tmp/hl-valve/.github
          mkdir -p hlsdk/valve
          cp -R /tmp/hl-valve/. hlsdk/valve/
          echo "hlsdk/valve/ ready"

      # --------------------------------------------------
      # 3. Vendor HLSDK-Portable (gearbox = opfor branch)
      # --------------------------------------------------
      - name: Clone HLSDK gearbox (opfor)
        run: |
          git clone --depth=1 --branch opfor https://github.com/FWGS/hlsdk-portable.git /tmp/hl-gear
          rm -rf /tmp/hl-gear/.git /tmp/hl-gear/.github
          mkdir -p hlsdk/gearbox
          cp -R /tmp/hl-gear/. hlsdk/gearbox/
          echo "hlsdk/gearbox/ ready"

      # --------------------------------------------------
      # 4. Vendor HLSDK-Portable (bshift)
      # --------------------------------------------------
      - name: Clone HLSDK bshift
        run: |
          git clone --depth=1 --branch bshift https://github.com/FWGS/hlsdk-portable.git /tmp/hl-bshift
          rm -rf /tmp/hl-bshift/.git /tmp/hl-bshift/.github
          mkdir -p hlsdk/bshift
          cp -R /tmp/hl-bshift/. hlsdk/bshift/
          echo "hlsdk/bshift/ ready"

      # --------------------------------------------------
      # 5. Vendor CS 1.6 + CZ (from cs16-client)
      # --------------------------------------------------
      - name: Clone CS16 Client (cstrike + czero)
        if: ${{ github.event.inputs.include_cstrike == 'true' }}
        run: |
          git clone --depth=1 https://github.com/Velaron/cs16-client.git /tmp/cs16
          rm -rf /tmp/cs16/.git /tmp/cs16/.github
          mkdir -p hlsdk/cstrike hlsdk/czero
          cp -R /tmp/cs16/. hlsdk/cstrike/
          cp -R /tmp/cs16/. hlsdk/czero/
          echo "hlsdk/cstrike/ + hlsdk/czero/ ready"

      # --------------------------------------------------
      # 6. Clean up non-iOS platforms
      # --------------------------------------------------
      - name: Remove non-iOS platforms
        run: |
          find engine -type d \( -name "android" -o -name "win32" -o -name "linux" -o -name "bsd" -o -name "switch" -o -name "psvita" -o -name "dos" -o -name "emscripten" -o -name "haiku" -o -name "serenityos" \) -exec rm -rf {} + 2>/dev/null || true
          echo "Cleaned non-iOS platforms"

      # --------------------------------------------------
      # 7. Create placeholder ios/ folder
      # --------------------------------------------------
      - name: Create ios folder
        run: |
          mkdir -p ios/XashFusion/App ios/XashFusion/UI ios/XashFusion/Resources ios/SDL2
          touch ios/XashFusion/.gitkeep
          touch ios/SDL2/.gitkeep

      # --------------------------------------------------
      # 8. Show final structure
      # --------------------------------------------------
      - name: Show final tree
        run: |
          echo "=== Top level ==="
          ls -la
          echo ""
          echo "=== engine/ (first 20) ==="
          ls engine/ | head -20
          echo ""
          echo "=== hlsdk/ ==="
          ls hlsdk/
          echo ""
          echo "=== Total files ==="
          find . -type f -not -path "./.git/*" | wc -l

      # --------------------------------------------------
      # 9. Commit + push
      # --------------------------------------------------
      - name: Commit and push
        run: |
          git config user.name  "XashFusion Bot"
          git config user.email "bot@xashfusion.local"
          git add -A
          git commit -m "Vendor Xash3D-FWGS engine + HLSDK (valve, gearbox, bshift, cstrike, czero)" || echo "No changes"
          git push
