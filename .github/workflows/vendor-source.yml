name: Vendor Source Code Into Repo

# Manual-trigger only - this is a one-time (or occasional) housekeeping
# task, not something that should run on every push like the build
# workflow does.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone engine source (FWGS/xash3d-fwgs, master)
        run: |
          rm -rf engine
          git clone --depth 1 https://github.com/FWGS/xash3d-fwgs engine
          rm -rf engine/.git

      - name: Clone hlsdk-portable source (master = valve gamedir)
        run: |
          rm -rf hlsdk-portable
          git clone --depth 1 https://github.com/FWGS/hlsdk-portable hlsdk-portable
          rm -rf hlsdk-portable/.git

      - name: Strip non-iOS platform folders (this device only builds iOS)
        run: |
          # Top-level per-platform project folders (Android Studio
          # project etc.) - not source code, just other platforms'
          # build glue.
          rm -rf engine/android
          rm -rf hlsdk-portable/android

          # engine/platform/<name> - one folder per OS the engine
          # supports. Keep only what iOS actually needs:
          #   ios/    - the iOS platform layer itself
          #   apple/  - shared Apple-family code (used by iOS, not just macOS)
          #   posix/  - shared POSIX code (iOS is POSIX-based)
          #   sdl2/   - the SDL backend our iOS build links against
          # Remove every other OS's platform folder.
          for d in android dos irix linux nswitch psvita sdl1 sdl3 win32; do
            rm -rf "engine/platform/$d"
          done

          echo "Remaining engine/platform/ folders (should be iOS-relevant only):"
          ls engine/platform/

      - name: Write README explaining what's vendored here
        run: |
          cat > VENDORED_SOURCE.md << 'EOF'
          # Vendored source code

          This repo mirrors the actual engine and game-SDK source used by
          the iOS build workflow, so the code is browsable directly on
          GitHub (not just referenced by a CI script).

          - `engine/` - Xash3D-FWGS engine
            ([FWGS/xash3d-fwgs](https://github.com/FWGS/xash3d-fwgs), `master`)
          - `hlsdk-portable/` - Half-Life SDK
            ([FWGS/hlsdk-portable](https://github.com/FWGS/hlsdk-portable), `master`
            = Half-Life / `valve` gamedir)

          Two more games are built from the **same hlsdk-portable repo on
          different branches** - `opfor` (Opposing Force / `gearbox`) and
          `bshift` (Blue Shift). Those aren't vendored here (to avoid
          tripling this repo's size); the build workflow checks them out
          directly at build time. Browse them on GitHub:
          - https://github.com/FWGS/hlsdk-portable/tree/opfor
          - https://github.com/FWGS/hlsdk-portable/tree/bshift

          **Not included:** other platforms' code (Android, Windows,
          Linux, PS Vita, Switch, etc. - stripped out since this repo
          only ever builds for iOS), game content
          (maps/models/textures/sounds - copyrighted, comes from a
          legally-owned Steam install), and built `.ipa` files
          (published to this repo's Releases, never committed to the
          source tree).

          This snapshot was pulled by the "Vendor Source Code Into Repo"
          workflow, run manually, not on every push - re-run it any time
          you want to refresh these folders to upstream's latest.
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engine hlsdk-portable VENDORED_SOURCE.md
          if git diff --cached --quiet; then
            echo "No changes - source already up to date."
          else
            git commit -m "Vendor engine + hlsdk-portable source [skip ci]"
            git push
          fi
